syntax = "proto3";

package vpn.infrastructure;

// Сервис, который работает на Главном сервере (Hub)
service HubService {
  // Двунаправленный канал связи. 
  // Node шлет регистрацию и статистику, Hub шлет команды управления.
  rpc ConnectNode (stream NodeMessage) returns (stream HubCommand);
}

// ==========================================
// СООБЩЕНИЯ ОТ НОДЫ (NODE) К HUB
// ==========================================

message NodeMessage {
  // Базовая авторизация для каждого пакета в стриме
  string node_id = 1;      // Например: "nebula-eu-01"
  string auth_secret = 2;  // Pre-Shared Key

  // Тело сообщения
  oneof payload {
    NodeRegistration registration = 3;
    TrafficReport traffic_report = 4;
    CommandResult command_result = 5;
  }
}

// Отправляется Нодой самым ПЕРВЫМ сообщением при установке соединения.
message NodeRegistration {
  string public_ip = 1;      // Внешний IP ноды (например, "198.51.100.22")
  repeated InboundConfig inbounds = 2; // Список доступных протоколов и их настроек
}

// Конфигурация конкретной точки входа на Ноде
message InboundConfig {
  string protocol = 1;      // "vless" или "hysteria2"
  uint32 port = 2;          // Порт (например, 443)
  string inbound_tag = 3;   // Уникальный тег Xray (например, "vless-reality-in")

  // Специфичные настройки протокола
  oneof settings {
    RealitySettings reality = 4;
    HysteriaSettings hysteria = 5;
  }
}

// Метаданные для VLESS + Reality
message RealitySettings {
  string pbk = 1;
  string sid = 2;
  string sni = 3;
}

// Метаданные для Hysteria2 (QUIC/UDP)
message HysteriaSettings {
  string auth_password = 1; 
  string sni = 2;           
}

// Отчет по трафику (шлется Нодой периодически)
message TrafficReport {
  // Ключ: email (или uuid) пользователя, Значение: байты
  map<string, uint64> user_bytes = 1; 
}

// Подтверждение выполнения команды от Hub
message CommandResult {
  string command_id = 1;
  bool success = 2;
  string error_message = 3;
}

// ==========================================
// СООБЩЕНИЯ ОТ HUB К НОДЕ (NODE)
// ==========================================

message HubCommand {
  string command_id = 1; 
  
  oneof command {
    AddUser add_user = 2;
    RemoveUser remove_user = 3;
  }
}

// Команда: "Добавь юзера"
message AddUser {
  string uuid = 1;
  string email = 2; // Обязательное поле для API Xray-core
  
  // Список тегов Xray, в которые нужно добавить пользователя
  repeated string inbound_tags = 3; 
}

// Команда: "Отключи юзера"
message RemoveUser {
  string email = 1; 
  // При удалении тоже желательно передавать теги, 
  // чтобы вычистить юзера из всех инбаундов
  repeated string inbound_tags = 2; 
}
